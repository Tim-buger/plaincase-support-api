[project]
name = "llm-api-integration-service"
version = "0.1.0"
description = "Production-minded structured AI extraction API with retries, idempotency, audit logs, and a live demo."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Zesai Yue" }]
dependencies = [
  "fastapi>=0.115.0,<1.0",
  "openai>=1.100.0,<3.0",
  "pydantic-settings>=2.6.0,<3.0",
  "python-json-logger>=3.2.0,<4.0",
  "uvicorn[standard]>=0.32.0,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0,<1.0",
  "pytest>=8.3.0,<9.0",
  "pytest-asyncio>=0.24.0,<1.0",
  "ruff>=0.9.0,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

